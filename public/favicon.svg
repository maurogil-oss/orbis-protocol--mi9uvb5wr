<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="globeGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#2bd9a5" />
      <stop offset="60%" stop-color="#12B886" />
      <stop offset="100%" stop-color="#083a2d" />
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
  </defs>
  <!-- Outer metallic ring -->
  <circle cx="50" cy="50" r="47" fill="none" stroke="url(#ringGrad)" stroke-width="5" />
  <!-- Inner globe background -->
  <circle cx="50" cy="50" r="43" fill="url(#globeGrad)" />
  <!-- Stylized leaf & continents overlay in silver/white -->
  <path d="M 40 85 C 40 85 45 60 70 45 C 50 45 42 62 40 85 Z" fill="#ffffff" fill-opacity="0.85" />
  <path d="M 52 56 L 62 50" stroke="#12B886" stroke-width="2" stroke-linecap="round" />
  <path d="M 47 67 L 57 61" stroke="#12B886" stroke-width="2" stroke-linecap="round" />
</svg>
